[package]
name = "DB"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
bincode = "1.3.3"
toml = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[[bin]]
name="rust-db"
path="src/main.rs"