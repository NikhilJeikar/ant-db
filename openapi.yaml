openapi: 3.0.0
info:
  title: Rust Database API
  description: |
    RESTful API for a thread-safe, concurrent Rust database engine.
    Supports CRUD operations on tables, columns, and rows with multiple data types.
  version: 1.0.0
  contact:
    name: DB API Support
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8080
    description: Local development server
  - url: http://localhost:8080
    description: Localhost

tags:
  - name: Health
    description: Server health and status
  - name: Tables
    description: Table management operations
  - name: Columns
    description: Column management operations
  - name: Rows
    description: Row CRUD operations

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Server health check
      description: Check if the API server is running and healthy
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/tables:
    post:
      tags:
        - Tables
      summary: Create a new table
      description: Create a new table with the specified name
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTableResponse'
        '500':
          description: Failed to create table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Tables
      summary: List all tables
      description: Get a list of all tables in the database
      operationId: listTables
      responses:
        '200':
          description: List of tables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResponse'
        '503':
          description: Database unavailable (lock poisoned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/by-name/{name}:
    get:
      tags:
        - Tables
      summary: Get table ID by name
      description: Retrieve the table ID for a table by its name
      operationId: getTableByName
      parameters:
        - name: name
          in: path
          required: true
          description: Table name
          schema:
            type: string
      responses:
        '200':
          description: Table found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTableByNameResponse'
        '404':
          description: Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}:
    delete:
      tags:
        - Tables
      summary: Drop a table
      description: Delete a table and all its data
      operationId: dropTable
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      responses:
        '200':
          description: Table dropped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropTableResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/schema:
    get:
      tags:
        - Tables
      summary: Get table schema
      description: Retrieve the schema (columns and types) of a table
      operationId: getTableSchema
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      responses:
        '200':
          description: Schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSchemaResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/size:
    get:
      tags:
        - Tables
      summary: Get table row count
      description: Get the number of rows in a table
      operationId: getTableSize
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      responses:
        '200':
          description: Row count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSizeResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/columns:
    post:
      tags:
        - Columns
      summary: Create a new column
      description: Add a new column to a table
      operationId: createColumn
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          description: Column created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateColumnResponse'
        '500':
          description: Failed to create column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/columns/{column_id}:
    delete:
      tags:
        - Columns
      summary: Drop a column
      description: Delete a column from a table
      operationId: dropColumn
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
        - name: column_id
          in: path
          required: true
          description: Column ID
          schema:
            type: integer
            format: uint32
      responses:
        '200':
          description: Column dropped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropColumnResponse'
        '500':
          description: Failed to drop column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/rows:
    post:
      tags:
        - Rows
      summary: Insert rows
      description: Insert one or more rows into a table
      operationId: insertRows
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertRowsRequest'
      responses:
        '201':
          description: Rows inserted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertRowsResponse'
        '400':
          description: Invalid request or data mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to insert rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Rows
      summary: Delete rows
      description: Delete rows from a table based on row IDs
      operationId: deleteRows
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRowsRequest'
      responses:
        '200':
          description: Rows deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRowsResponse'
        '500':
          description: Failed to delete rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Rows
      summary: Update rows
      description: Update one or more rows in a table
      operationId: updateRows
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRowsRequest'
      responses:
        '200':
          description: Rows updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRowsResponse'
        '400':
          description: Invalid request or data mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tables/{table_id}/rows/{row_id}:
    get:
      tags:
        - Rows
      summary: Get a specific row
      description: Retrieve a row by its ID
      operationId: getRow
      parameters:
        - name: table_id
          in: path
          required: true
          description: Table ID
          schema:
            type: integer
            format: uint64
        - name: row_id
          in: path
          required: true
          description: Row ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Row retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRowResponse'
        '404':
          description: Row not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Request/Response DTOs
    CreateTableRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Table name
          example: users

    CreateTableResponse:
      type: object
      properties:
        table_id:
          type: integer
          format: uint32
          example: 1

    ListTablesResponse:
      type: object
      properties:
        tables:
          type: array
          items:
            type: object
            properties:
              table_id:
                type: integer
                format: uint32
              table_name:
                type: string

    GetTableByNameResponse:
      type: object
      properties:
        table_id:
          type: integer
          format: uint32

    DropTableResponse:
      type: object
      properties:
        success:
          type: boolean

    GetSchemaResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'

    ColumnInfo:
      type: object
      properties:
        column_id:
          type: integer
          format: uint32
        column_name:
          type: string
        data_type:
          type: string
          enum:
            - IntegerU8
            - IntegerI128
            - String
            - Boolean

    GetSizeResponse:
      type: object
      properties:
        row_count:
          type: integer
          format: uint32

    CreateColumnRequest:
      type: object
      required:
        - column_name
        - data_type
      properties:
        column_name:
          type: string
          example: email
        data_type:
          type: string
          enum:
            - IntegerU8
            - IntegerI128
            - String
            - Boolean
          example: String

    CreateColumnResponse:
      type: object
      properties:
        column_id:
          type: integer
          format: uint32

    DropColumnResponse:
      type: object
      properties:
        success:
          type: boolean

    InsertRowsRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          description: Array of rows to insert. Each row is an array of column values.
          items:
            type: array
            items:
              $ref: '#/components/schemas/CellData'
          example:
            - - column_id: 1
                data:
                  String: "alice@example.com"
              - column_id: 2
                data:
                  IntegerU8: 25
            - - column_id: 1
                data:
                  String: "bob@example.com"
              - column_id: 2
                data:
                  IntegerU8: 30

    CellData:
      type: object
      required:
        - column_id
        - data
      properties:
        column_id:
          type: integer
          format: uint32
        data:
          oneOf:
            - type: object
              properties:
                IntegerU8:
                  type: integer
                  minimum: 0
                  maximum: 255
            - type: object
              properties:
                IntegerI128:
                  type: integer
                  format: int64
            - type: object
              properties:
                String:
                  type: string
            - type: object
              properties:
                Boolean:
                  type: boolean

    InsertRowsResponse:
      type: object
      properties:
        rows_inserted:
          type: integer
          format: uint32

    DeleteRowsRequest:
      type: object
      required:
        - row_ids
      properties:
        row_ids:
          type: array
          items:
            type: integer
            format: uint64
          example: [1, 2, 3]

    DeleteRowsResponse:
      type: object
      properties:
        rows_deleted:
          type: integer
          format: uint32

    UpdateRowsRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              row_id:
                type: integer
                format: uint64
              cells:
                type: array
                items:
                  $ref: '#/components/schemas/CellData'

    UpdateRowsResponse:
      type: object
      properties:
        rows_updated:
          type: integer
          format: uint32

    GetRowResponse:
      type: object
      properties:
        row_id:
          type: integer
          format: uint64
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CellData'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Internal server error"

    DataValue:
      oneOf:
        - type: object
          properties:
            IntegerU8:
              type: integer
              minimum: 0
              maximum: 255
          required:
            - IntegerU8
        - type: object
          properties:
            IntegerI128:
              type: integer
              format: int64
          required:
            - IntegerI128
        - type: object
          properties:
            String:
              type: string
          required:
            - String
        - type: object
          properties:
            Boolean:
              type: boolean
          required:
            - Boolean

  securitySchemes: {}

security: []

x-logo:
  url: https://www.rust-lang.org/static/images/rust-logo-blurred.svg
  altText: Rust Database API

externalDocs:
  description: View full documentation files
  url: https://github.com/your-org/rust-db
